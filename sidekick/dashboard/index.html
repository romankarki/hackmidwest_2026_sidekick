<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidekick</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2318181b%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27700%27%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/shadcn.css">
<script src="assets/common.js"></script>
<style>
  .page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-h h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .page-h p { margin: 4px 0 0; color: var(--muted-foreground); }
  .page-h .actions { align-items: center; }
  .two { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
  .stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .int { padding: 16px; display: grid; gap: 12px; align-content: start; }
  .int .top { display: flex; align-items: center; gap: 10px; }
  .logo-sq { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 11px; color: #fff; flex: none; }
  .scopes { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-start; }
  .scopes code { background: var(--muted); padding: 1px 6px; border-radius: 4px; font-size: 11.5px; }
  h2.sec { font-size: 14px; font-weight: 500; margin: 8px 0 -4px; color: var(--muted-foreground); }
  .skill { padding: 20px; display: grid; gap: 12px; align-content: start; }
  .skill .top { display: flex; align-items: center; gap: 12px; }
  .kind-ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none; color: var(--kc); background: color-mix(in oklch, var(--kc) 14%, transparent); }
  .policy { display: flex; gap: 14px; align-items: flex-start; padding: 14px 24px; border-top: 1px solid var(--border); }
  .policy .t { font-weight: 500; }
  .policy .dsc { color: var(--muted-foreground); font-size: 13px; }
  .policy .switch { margin-left: auto; margin-top: 2px; }

  /* console */
  .console { display: grid; grid-template-rows: 1fr auto; height: calc(100vh - 230px); min-height: 460px; overflow: hidden; }
  .console .log { overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; }
  .console .q { align-self: flex-end; background: var(--primary); color: var(--primary-foreground); padding: 8px 14px; border-radius: 14px 14px 4px 14px; max-width: 80%; }
  .console .a { display: grid; grid-template-columns: 32px 1fr; gap: 10px; max-width: 900px; }
  .console .a .av { width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; font-weight: 600; }
  .console .bottom { border-top: 1px solid var(--border); padding: 12px 16px; display: grid; gap: 10px; }
  .console .row { display: flex; gap: 8px; }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted-foreground); display: grid; gap: 8px; justify-items: center; }
  .empty b { color: var(--foreground); font-weight: 600; }

  /* ===== Workflow builder ===== */
  .wf-page { display: grid; gap: 12px; }
  .wf-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .wf-bar h1 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin-right: 4px; }
  .wf-below { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .palette .list { overflow-y: auto; padding: 0 12px 12px; display: grid; gap: 2px; }
  .palette .grp { font-size: 12px; font-weight: 500; color: var(--muted-foreground); padding: 10px 4px 4px; }
  .pal-item { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: calc(var(--radius) - 2px); cursor: grab; font-size: 13.5px; border: 1px solid transparent; user-select: none; }
  .pal-item:hover { background: var(--accent); }
  .pal-item:active { cursor: grabbing; }
  .pal-item .kind-ic { width: 26px; height: 26px; border-radius: 6px; }
  .pal-item .kind-ic svg { width: 14px; height: 14px; }
  .pal-item .add { margin-left: auto; opacity: 0; }
  .pal-item:hover .add { opacity: 1; }

  .node { width: min(380px, 100%); display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--kc);
    border-radius: var(--radius); box-shadow: 0 1px 3px rgb(0 0 0 / .06); cursor: grab; position: relative; transition: box-shadow .15s, border-color .15s, opacity .15s; }
  .node:hover { box-shadow: 0 2px 8px rgb(0 0 0 / .08); }
  .node.sel { box-shadow: 0 0 0 2px var(--ring); }
  .node.ghost { opacity: .35; }
  .node .grip { color: var(--muted-foreground); opacity: .6; }
  .node .txt { flex: 1; min-width: 0; }
  .node .k { font-size: 11px; font-weight: 500; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .04em; }
  .node .l { font-weight: 500; font-size: 14px; }
  .node .sum { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .del { opacity: 0; }
  .node:hover .del { opacity: 1; }
  .node .state { position: absolute; top: -9px; right: -9px; width: 20px; height: 20px; border-radius: 50%; display: none; place-items: center; background: var(--good); color: #fff; }
  .node .state svg { width: 12px; height: 12px; stroke-width: 3; }
  .node.done .state { display: grid; }
  .node.running { box-shadow: 0 0 0 2px var(--kc); animation: pulse 1s ease infinite; }
  .node.waiting { box-shadow: 0 0 0 2px var(--warn); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in oklch, var(--kc) 25%, transparent); } }
  .node.highlight { box-shadow: 0 0 0 2px var(--k-delivery); }

  .dz { width: min(380px, 100%); height: 22px; display: grid; place-items: center; position: relative; transition: height .12s; }
  .dz::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-50%); background: var(--border); }
  .dz::after { content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--border); border-bottom: 0; }
  .dz.first::before, .dz.first::after, .dz.last::before, .dz.last::after { display: none; }
  .dz .plus { position: relative; z-index: 1; opacity: 0; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); background: var(--background); display: grid; place-items: center; color: var(--muted-foreground); cursor: pointer; }
  .dz:hover .plus { opacity: 1; }
  .dz .plus svg { width: 12px; height: 12px; }
  .dragging .dz { height: 46px; }
  .dragging .dz .drop { position: absolute; inset: 6px 0; border: 1.5px dashed var(--input); border-radius: var(--radius); background: var(--background); z-index: 1; display: grid; place-items: center; font-size: 12px; color: var(--muted-foreground); }
  .dz .drop { display: none; }
  .dragging .dz .drop { display: grid; }
  .dragging .dz .plus { display: none; }
  .dz.over .drop { border-color: var(--primary); color: var(--foreground); background: var(--accent); }
  .dz.first, .dz.last { height: 8px; }
  .dragging .dz.first, .dragging .dz.last { height: 46px; }
  .end-cap { margin-top: 6px; font-size: 12px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }

  .insp .fields { display: grid; gap: 14px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 500; }
  .val { display: grid; gap: 8px; font-size: 13px; }
  .val div { display: flex; gap: 8px; align-items: flex-start; }
  .val svg { margin-top: 2px; }
  .val .good { color: var(--good); } .val .warn { color: var(--warn); } .val .bad { color: var(--destructive); }
  /* map canvas: pannable / zoomable, with floating panels */
  .map { position: relative; height: max(540px, calc(100vh - 140px)); overflow: hidden; border-radius: calc(var(--radius) + 4px); border: 1px solid var(--border); cursor: grab; touch-action: none;
    background-color: var(--card); background-image: radial-gradient(color-mix(in oklch, var(--foreground) 16%, transparent) 1px, transparent 1px); background-size: 18px 18px; }
  .map.panning { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .world .flow { width: 420px; padding: 8px 20px; }
  .world .node, .world .dz { width: 380px; }
  .fp { position: absolute; z-index: 5; display: flex; flex-direction: column; max-height: calc(100% - 24px); cursor: default;
    background: color-mix(in oklch, var(--card) 94%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 4px 16px rgb(0 0 0 / .08); }
  .fp.moving { box-shadow: 0 10px 30px rgb(0 0 0 / .18); }
  .fp-h { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; cursor: move; user-select: none; white-space: nowrap; }
  .fp-h > svg.i { color: var(--muted-foreground); width: 14px; height: 14px; }
  .fp-sub { font-weight: 400; font-size: 12px; color: var(--muted-foreground); }
  .fp.collapsed .fp-b, #fp-steps.collapsed .fp-b { display: none; }
  .fp.collapsed .fp-h { border-bottom: 0; }
  .fp-b { min-height: 0; overflow-y: auto; }
  #fp-steps { width: 240px; max-height: calc(100% - 80px); }
  #fp-steps .fp-b { display: flex; flex-direction: column; overflow: hidden; }
  #fp-insp { width: 300px; }
  .fp .card { border: 0; box-shadow: none; background: transparent; border-radius: 0; }
  .fp-legend .fp-h { border-bottom: 0; font-weight: 400; color: var(--muted-foreground); font-size: 12px; gap: 10px; padding: 6px 12px; }
  .fp-legend .lg { display: inline-flex; align-items: center; gap: 5px; }
  .fp-legend .lg i { width: 8px; height: 8px; border-radius: 2px; background: var(--kc); display: inline-block; }
  .map-ctrls { position: absolute; left: 12px; bottom: 12px; z-index: 6; display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); cursor: default; }
  .map-ctrls .btn { font-size: 16px; }
  .zoom-pct { min-width: 44px; text-align: center; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .map-hint { font-size: 12px; color: var(--muted-foreground); padding: 0 8px 0 4px; white-space: nowrap; }
  @media (max-width: 1100px) { .map-hint { display: none; } .wf-below { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { .map { height: 75vh; } #fp-insp { width: min(300px, calc(100% - 24px)); } }
  #fp-steps .list { flex: 1; min-height: 0; }
  .add-menu { position: absolute; z-index: 30; width: 240px; max-height: 320px; overflow-y: auto; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 24px rgb(0 0 0 / .12); padding: 4px; }
  .add-menu .grp { font-size: 12px; color: var(--muted-foreground); padding: 6px 8px 2px; }
  .add-menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 13.5px; text-align: left; }
  .add-menu button:hover { background: var(--accent); }

  @media (max-width: 1000px) { .two { grid-template-columns: 1fr; } }

  /* ===== live backend UI ===== */
  .md { line-height: 1.55; }
  .md a { text-decoration: underline; text-underline-offset: 2px; font-weight: 500; }
  .md code { background: var(--muted); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .md pre { background: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 6px 0; font-family: var(--mono); font-size: 12.5px; white-space: pre; }
  .step .tag { font-size: 11px; padding: 0 6px; }
  .int .status { font-size: 12.5px; color: var(--muted-foreground); min-height: 18px; overflow-wrap: anywhere; }
  .int .status.ok { color: var(--good); } .int .status.err { color: var(--destructive); }
  .int.disabled { opacity: .55; }
  .modal-bg { position: fixed; inset: 0; z-index: 80; background: rgb(0 0 0 / .45); display: grid; place-items: center; padding: 16px; }
  .modal { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
  .modal form { display: grid; gap: 14px; }
  .modal .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .hint { font-size: 12.5px; color: var(--muted-foreground); font-weight: 400; }
  .result { padding: 10px 12px; border-radius: 8px; font-size: 13px; overflow-wrap: anywhere; }
  .result.ok { background: var(--good-soft); color: var(--good); } .result.err { background: var(--bad-soft); color: var(--destructive); }
  .appr { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .appr .grow { flex: 1; min-width: 240px; }
  .run-detail td { background: color-mix(in oklch, var(--muted) 40%, transparent); }
  .run-detail .agent-steps { max-width: 820px; }
  .tbl input.input, .tbl select.input { height: 32px; font-size: 13px; }
  .add-user { display: grid; grid-template-columns: 1.2fr 1.4fr .9fr 1.1fr auto; gap: 8px; padding: 12px 24px 20px; align-items: end; }
  @media (max-width: 900px) { .add-user { grid-template-columns: 1fr 1fr; } }
  .console-head { display: flex; gap: 8px; align-items: center; }
  .conv-status { font-size: 12px; }
</style>
</head>

<script>
// ---------- icons ----------
const IC = {
  trigger: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  skill: '<rect width="16" height="12" x="4" y="8" rx="2"/><path d="M12 8V4H8"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>',
  gate: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  delivery: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/>',
  notify: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  grip: '<circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/>',
  plus: '<path d="M5 12h14M12 5v14"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  x: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>',

// ---------- API ----------
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw new Error((data && (typeof data.detail === "string" ? data.detail : data.detail?.[0]?.msg)) || `HTTP ${r.status}`);
  return data;
}
const GET = (p) => api("GET", p);

function statusBadge(s) {
  const m = { done: ["good", "Done"], running: ["info", "Running"], failed: ["bad", "Failed"], pending: ["warn", "Awaiting approval"], approved: ["good", "Approved"],
    rejected: ["bad", "Rejected"], connected: ["good", "Connected"], configured: ["warn", "Not tested"], error: ["bad", "Error"], not_configured: ["", "Not configured"] };
  const [c, l] = m[s] || ["", s];
  return `<span class="badge ${c}">${l}</span>`;
}
function ago(ts) {
  if (!ts) return "—";
  const s = (Date.now() - new Date(ts).getTime()) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return `${Math.floor(s / 60)}m ago`; if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return new Date(ts).toLocaleDateString();
}
function dur(a, b) { if (!a || !b) return "—"; return `${Math.round((new Date(b) - new Date(a)) / 1000)}s`; }
// Slack-style mrkdwn → HTML (the brain writes one format for Slack and the dashboard)
function md(text) {
  let h = esc(text || "");
  const blocks = [];
  h = h.replace(/```([\s\S]*?)```/g, (_, c) => { blocks.push(`<pre>${c.replace(/^\n/, "")}</pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  h = h.replace(/&lt;(https?:\/\/[^|\s&]+)\|([^&\n]+?)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$2</a>')  // Slack-style <url|text> links
       .replace(/`([^`\n]+)`/g, "<code>$1</code>")
       .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,:;!?]|$)/g, "$1<b>$2</b>")
       .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,:;!?]|$)/g, "$1<i>$2</i>")
       .replace(/\n/g, "<br>");
  return h.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}
function pageH(title, desc, actions = "") { return `<div class="page-h"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`; }
function stepHTML(s) {
  const live = s.integration && BRAIN_MODE === "llm" && s.tool.includes("_");  // LLM tool calls are real
  const tag = s.integration ? `<span class="badge tag ${s.connected ? "good" : ""}">${esc(s.integration)}${s.connected ? " ✓" : live ? " · not connected" : " · simulated"}</span>` : "";
  const icon = s.status === "running" ? '<span class="spin"></span>' : s.status === "error" ? '<span class="ok" style="color:var(--destructive)">✕</span>' : '<span class="ok">✓</span>';
  return `<div class="step">${icon}<span class="tool">${esc(s.tool)}</span><span class="dim">${esc(s.detail)}</span>${tag}<span class="st muted">${s.status === "running" ? "running…" : (s.secs ?? "") + "s"}</span></div>`;
}
function actionsHTML(actions) {
  if (!actions?.length) return "";
  return `<div class="actions">${actions.map(a => a.url ? `<a class="btn sm primary" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.label)}</a>` : `<button class="btn sm ${a.style === "primary" ? "primary" : a.style === "danger" ? "destructive" : ""}" data-act='${esc(JSON.stringify(a))}'>${esc(a.label)}</button>`).join("")}</div>`;
}

function openIntegrationModal(key) {

    </form></div>`;

    e.preventDefault();
    const values = Object.fromEntries(new FormData(e.target).entries());
    const res = m.querySelector("#int-result"), btns = m.querySelectorAll("button[type=submit]");
    btns.forEach(b => (b.disabled = true));
    try {
      await api("PUT", `/api/integrations/${key}`, values);

    btns.forEach(b => (b.disabled = false));

// ---------- map: pan / zoom / floating panels ----------
const mapView = { x: null, y: 24, z: 1 };   // x === null → fit on next render
const panels = { steps: { x: 12, y: 12, c: false }, insp: { x: null, y: 12, c: false }, legend: { x: null, y: null } };
let justPanned = false;

function applyView(animate) {
  const world = document.getElementById("world"), map = document.getElementById("canvas"); if (!world) return;
  world.style.transition = animate ? "transform .3s ease" : "";
  world.style.transform = `translate(${mapView.x}px, ${mapView.y}px) scale(${mapView.z})`;
  map.style.backgroundPosition = `${mapView.x}px ${mapView.y}px`;
  map.style.backgroundSize = `${18 * mapView.z}px ${18 * mapView.z}px`;
  const pct = document.getElementById("zoom-pct"); if (pct) pct.textContent = Math.round(mapView.z * 100) + "%";
}
function freeArea() { // horizontal space not covered by the side panels
  const map = document.getElementById("canvas"), W = map.clientWidth;
  const st = document.getElementById("fp-steps"), ins = document.getElementById("fp-insp");
  let L = 0, R = W;
  if (st && st.offsetLeft < W / 2) L = st.offsetLeft + st.offsetWidth;
  if (ins && ins.offsetLeft > W / 2) R = ins.offsetLeft;
  let top = 16;
  if (R - L < 360) { L = 0; R = W; top = 104; } // narrow: panels sit above the flow instead of beside it
  return { L, R, H: map.clientHeight, top };
}
function fitView(animate, minZ = 0.4) {
  const flow = document.getElementById("flow"); if (!flow) return;
  const { L, R, H, top } = freeArea();
  const w = flow.offsetWidth, h = flow.offsetHeight;
  mapView.z = Math.max(minZ, Math.min(1, (H - top - 74) / h, (R - L - 40) / w));
  mapView.x = L + (R - L - w * mapView.z) / 2;
  mapView.y = Math.max(top, (H - 50 - h * mapView.z) / 2);
  applyView(animate);
}
function zoomAt(k, px, py) {
  const z = Math.max(0.3, Math.min(2, mapView.z * k)); k = z / mapView.z;
  mapView.x = px - (px - mapView.x) * k; mapView.y = py - (py - mapView.y) * k; mapView.z = z;
  applyView();
}
function ensureVisible(el) {
  const map = document.getElementById("canvas").getBoundingClientRect(), r = el.getBoundingClientRect();
  if (r.bottom > map.bottom - 70) mapView.y -= r.bottom - (map.bottom - 70);
  else if (r.top < map.top + 20) mapView.y += (map.top + 20) - r.top;
  else return;
  applyView(true);
}
function placePanels() {
  const map = document.getElementById("canvas"), W = map.clientWidth, H = map.clientHeight;
  for (const id of ["steps", "insp", "legend"]) {
    const el = document.getElementById("fp-" + id), p = panels[id];
    if (p.x == null) p.x = W - el.offsetWidth - 12; // inspector top-right, legend bottom-right
    if (p.y == null) p.y = H - el.offsetHeight - 12;
    p.x = Math.max(0, Math.min(W - 60, p.x)); p.y = Math.max(0, Math.min(H - 36, p.y));
    el.style.left = p.x + "px"; el.style.top = p.y + "px";
  }
}
function initMap() {
  const map = document.getElementById("canvas"); if (!map) return;
  if (map.clientWidth < 760 && !panels._mobileInit) { panels.steps.c = panels.insp.c = true; panels.insp.y = 56; panels._mobileInit = true; return renderWorkflows(); }
  map.querySelector("#fp-steps").classList.toggle("collapsed", panels.steps.c);
  map.querySelector("#fp-insp").classList.toggle("collapsed", panels.insp.c);
  placePanels();
  if (mapView.x == null) fitView(false, 0.8); else applyView(); // first view: readable zoom, top-aligned; the fit button fits everything

  // pan on background
  let pan = null;
  map.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest(".node, .fp, .map-ctrls, .plus, #add-menu, button, input, select")) return;
    pan = { sx: e.clientX, sy: e.clientY, x: mapView.x, y: mapView.y, moved: false };
    map.setPointerCapture(e.pointerId); map.classList.add("panning");
  });
  map.addEventListener("pointermove", e => {
    if (!pan) return;
    const dx = e.clientX - pan.sx, dy = e.clientY - pan.sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) pan.moved = true;
    mapView.x = pan.x + dx; mapView.y = pan.y + dy; applyView();
  });
  const endPan = () => { if (!pan) return; justPanned = pan.moved; pan = null; map.classList.remove("panning"); };
  map.addEventListener("pointerup", endPan); map.addEventListener("pointercancel", endPan);

  // zoom on wheel (around cursor), but let panels scroll normally
  map.addEventListener("wheel", e => {
    if (e.target.closest(".fp, #add-menu")) return;
    e.preventDefault();
    const r = map.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  // drag floating panels by their header
  map.querySelectorAll(".fp-h").forEach(h => {
    const el = h.parentElement, p = panels[el.dataset.panel];
    let d = null;
    h.addEventListener("pointerdown", e => {
      if (e.target.closest("button")) return;
      d = { sx: e.clientX, sy: e.clientY, x: p.x, y: p.y }; h.setPointerCapture(e.pointerId); el.classList.add("moving");
    });
    h.addEventListener("pointermove", e => {
      if (!d) return;
      p.x = Math.max(0, Math.min(map.clientWidth - 60, d.x + e.clientX - d.sx));
      p.y = Math.max(0, Math.min(map.clientHeight - 36, d.y + e.clientY - d.sy));
      el.style.left = p.x + "px"; el.style.top = p.y + "px";
    });
    const up = () => { d = null; el.classList.remove("moving"); };
    h.addEventListener("pointerup", up); h.addEventListener("pointercancel", up);
  });
}

function mutate(fn) { saveWorkflows(ws => fn(ws.find(w => w.id === wfId))); renderWorkflows(); }
function insertAt(type, at) {
  const st = mkStep(type);
  mutate(wf => wf.steps.splice(at, 0, st));
  selUid = st.uid; renderWorkflows();
  toast(`Added “${STEP_CATALOG[type].label}”`);
}
function moveTo(uid, at) {
  mutate(wf => {
    const from = wf.steps.findIndex(s => s.uid === uid);
    if (from < 0) return;
    const [st] = wf.steps.splice(from, 1);
    wf.steps.splice(from < at ? at - 1 : at, 0, st);
  });
}

async function simulate() {
  if (simulating) return; simulating = true;
  const wf = getWorkflow(wfId);
  selUid = null; renderWorkflows();
  document.getElementById("wf-sim").innerHTML = ic("stop") + " Running…";
  for (const st of wf.steps) {
    const el = document.querySelector(`.node[data-uid="${st.uid}"]`); if (!el) break;

    el.classList.add(st.type === "approval" ? "waiting" : "running");

view.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "m-custom") saveModel({ custom_model: t.value });
  else if (t.id === "m-openai") saveModel({ model: t.value });
  else if (t.id === "m-transport") saveModel({ bedrock_transport: t.value });
  else if (t.id === "m-region") saveModel({ region: t.value.trim() || "us-east-1" });
  else if (t.id === "m-effort") saveModel({ effort: t.value });
  else if (t.id === "m-max") saveModel({ max_tokens: Math.max(256, Math.min(128000, +t.value || 16000)) });
  else if (t.dataset.skillModel !== undefined || t.dataset.skillEffort !== undefined) {
    const key = t.dataset.skillModel ?? t.dataset.skillEffort, skills = { ...(MODEL.config.skills || {}) };
    const cur = { model: "", effort: "", ...(skills[key] || {}) };
    if (t.dataset.skillModel !== undefined) cur.model = t.value; else cur.effort = t.value;
    skills[key] = cur;
    saveModel({ skills });
  }
});

// ---------- console (talks to the same brain as Slack) ----------
let CONSOLE_EL = null;
let THREAD = null;
try { THREAD = sessionStorage.getItem("sk-thread"); } catch (e) {}
if (!THREAD) newThreadId();
function newThreadId() { THREAD = "c-" + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem("sk-thread", THREAD); } catch (e) {} }

function buildConsole() {
  const el = document.createElement("div");
  el.className = "card console";
  el.innerHTML = `
    <div class="log" id="log" data-scroll>
      <div class="empty" id="empty"><b>What do you want to know or get done?</b><span>Sidekick remembers where this conversation is — try the spike, then “fix it”, then approve.</span></div>
    </div>
    <div class="bottom">
      <div class="chips" id="ask-chips">${SUGGESTED.map(p => `<button class="chip" data-fill="${esc(p.text)}">${esc(p.label)}</button>`).join("")}</div>
      <div class="row"><input class="input" id="ask-input" placeholder="e.g. There was a spike at 7:00 AM this morning — what's the reason?"><button class="btn primary" id="ask-send">Send</button></div>
    </div>`;
  const log = el.querySelector("#log"), inp = el.querySelector("#ask-input");
  const submit = () => { const v = inp.value.trim(); if (!v) return; inp.value = ""; consoleSend(v); };
  el.querySelector("#ask-send").onclick = submit;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  el.querySelector("#ask-chips").addEventListener("click", e => { const b = e.target.closest("[data-fill]"); if (b) { inp.value = b.dataset.fill; inp.focus(); } });
  log.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = JSON.parse(b.dataset.act);
    b.closest(".actions").querySelectorAll("button").forEach(x => (x.disabled = true));
    consoleSend(a.id === "say" ? a.value : null, a.id === "say" ? null : a);
  });
  return el;
}
function bubble(cls, html) {
  const log = CONSOLE_EL.querySelector("#log");
  CONSOLE_EL.querySelector("#empty")?.remove();
  const d = document.createElement("div"); d.className = cls; d.innerHTML = html; log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
async function consoleSend(text, action) {
  if (text) bubble("q", esc(text));
  else if (action) bubble("q", esc(action.label));
  const a = bubble("a", `<div class="av">S</div><div class="host"><div class="typing"><i></i><i></i><i></i></div></div>`);
  const host = a.querySelector(".host");
  try {
    const base = { source: "dashboard", channel: "console", thread_ts: THREAD, actor: ACTOR() };
    const res = action ? await api("POST", "/api/agent/action", { ...base, action: action.id, value: action.value || "" })
                       : await api("POST", "/api/agent/message", { ...base, text });
    host.innerHTML = res.reply?.text ? `<div class="agent-body"><div class="md">${md(res.reply.text)}</div>${actionsHTML(res.reply.actions)}</div>` : "";
    if (res.run_id) await followRun(host, res.run_id);
  } catch (e) { host.innerHTML = `<div class="result err">⚠️ ${esc(e.message)}</div>`; }
  updateConvStatus(); refreshSummary();
}
async function followRun(host, runId) {
  const box = document.createElement("div"); host.appendChild(box);
  const log = CONSOLE_EL.querySelector("#log");
  for (;;) {
    let r;
    try { r = await GET(`/api/runs/${runId}`); } catch (e) { await sleep(1500); continue; }
    box.innerHTML = `<div class="agent-meta"><span class="skill-tag">${SKILL_NAMES[r.skill] || r.skill}</span> <span class="muted" style="font-size:12px">${esc(r.title)} · ${r.steps.length} tool calls${r.model ? " · " + esc(r.model) : ""}</span></div>
      <div class="agent-steps">${r.steps.map(stepHTML).join("")}</div>
      ${r.status !== "running" && r.result ? `<div class="agent-body"><div class="md">${md(r.result.text)}</div>${actionsHTML(r.result.actions)}</div>` : ""}`;
    log.scrollTop = log.scrollHeight;
    if (r.status !== "running") return;
    await sleep(1000);
  }
}
async function updateConvStatus() {
  const el = document.getElementById("conv-status"); if (!el) return;
  try {
    const c = await GET(`/api/conversation?source=dashboard&channel=console&thread_ts=${encodeURIComponent(THREAD)}`);
    el.textContent = "Status: " + c.status.replace(/_/g, " ");
  } catch (e) { el.textContent = ""; }
}
function newConversation() {
  newThreadId();
  CONSOLE_EL = buildConsole();
  route(true);
  toast("New conversation started");
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ---------- router ----------
let PAGE_TIMER = null;
async function route(keepScroll) {
  const v = (location.hash || "#ask").slice(1);
  const key = views[v] ? v : "ask";
  clearInterval(PAGE_TIMER); PAGE_TIMER = null;
  document.querySelectorAll("#nav [data-v]").forEach(a => a.classList.toggle("on", a.dataset.v === key));
  document.getElementById("crumb").textContent = TITLES[key];
  const y = window.scrollY;
  try { view.innerHTML = await views[key](); }
  catch (e) { view.innerHTML = `<div class="card"><div class="card-b"><div class="result err">Couldn't reach the Sidekick API: ${esc(e.message)}</div></div></div>`; return; }
  if (key === "ask") {
    if (!CONSOLE_EL) CONSOLE_EL = buildConsole();
    document.getElementById("console-slot").replaceWith(CONSOLE_EL);
    updateConvStatus();
    CONSOLE_EL.querySelector("#ask-input").focus();
  }
  if (key === "workflows") renderWorkflows();
  if (key === "previews") PAGE_TIMER = setInterval(() => { if (!document.querySelector("#kill-all:disabled, [data-preview-del]:disabled")) route(true); }, 8000);
  if (key === "runs") PAGE_TIMER = setInterval(() => { if (!document.querySelector("#int-modal")) route(true); }, 4000);
  if (keepScroll) window.scrollTo(0, y);
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
route();
</script>
